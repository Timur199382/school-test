name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix paths for GitHub Pages subfolder
        run: |
          sed -i 's/BrowserRouter/HashRouter/g' src/main.tsx
          grep -rl '/characters/' src index.html | xargs sed -i 's#"/characters/#"./characters/#g; s#`/characters/#`./characters/#g'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: node node_modules/vite/bin/vite.js build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
